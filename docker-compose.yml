services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/demo.db
    volumes:
      - sparr-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: sparr
      POSTGRES_PASSWORD: sparr
      POSTGRES_DB: sparr
    volumes:
      - sparr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparr -d sparr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sparr-data:
  sparr-postgres:
